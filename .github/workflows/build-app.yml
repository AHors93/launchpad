name: Build & Submit App

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - android
          - all
      submit:
        description: 'Submit to store after build'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-app
  cancel-in-progress: false

jobs:
  quality-gate:
    name: ✅ Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Format check
        run: pnpm format:check

  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    needs: [quality-gate]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine platform
        id: platform
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.platform }}" >> $GITHUB_OUTPUT
          else
            echo "value=all" >> $GITHUB_OUTPUT
          fi

      - name: Build
        working-directory: app
        run: eas build --platform ${{ steps.platform.outputs.value }} --non-interactive --profile production

  submit:
    name: 🏪 Submit to stores
    runs-on: ubuntu-latest
    needs: [build]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.submit == true)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to TestFlight / Play Store
        working-directory: app
        run: |
          PLATFORM="${{ inputs.platform || 'all' }}"
          if [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "ios" ]; then
            eas submit --platform ios --latest --non-interactive
          fi
          if [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "android" ]; then
            eas submit --platform android --latest --non-interactive || true
          fi
